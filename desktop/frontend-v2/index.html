<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paula (preview)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        if (localStorage.getItem('paula-v2-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <style>
      html,body{background:#f7f5f0;margin:0}
      html[data-theme='dark'],html[data-theme='dark'] body{background:#08090b}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
