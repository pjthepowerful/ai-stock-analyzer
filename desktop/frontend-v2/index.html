<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paula — Know before you trade.</title>
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Paula — know before you trade. Stock research, signals and an earnings calendar, explained." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        // Black is the default; only an explicit Light (or System in light
        // mode) opts out.
        var t = localStorage.getItem('paula-theme')
        var light = t === 'light'
        if (!light) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <style>
      html,body{background:#f7f6f3;margin:0}
      html[data-theme='dark'],html[data-theme='dark'] body{background:#0a0a0b}
    </style>
      <!-- Old-Paula fonts, used only by the launch countdown page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
